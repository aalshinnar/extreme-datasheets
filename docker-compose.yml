version: '3.8'

services:
  mongodb:
    image: mongo:7-alpine
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: extreme-datasheets
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/extreme-datasheets
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-key-change-in-production
      EMAIL_SERVICE: gmail
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: noreply@extremenetworks.com
      CORS_ORIGIN: http://localhost:3000
      STORAGE_TYPE: local
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - app-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
